[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "certbot-dnspod-hook"
version = "0.4.0"
description = "Small Certbot DNS-01 hooks for Tencent Cloud DNSPod"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "certbot-dnspod-hook contributors"}]
keywords = ["certbot", "dnspod", "dns-01", "letsencrypt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = ["tencentcloud-sdk-python-common>=3.0.1000,<4", "dnspython>=2.6,<3"]

[project.scripts]
certbot-dnspod-hook = "certbot_dnspod_hook.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
release = ["pip==26.2.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
